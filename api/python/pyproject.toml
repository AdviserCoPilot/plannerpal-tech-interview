[project]
name = "atlas-academy-api"
version = "1.0.0"
description = "Atlas Academy EdTech class scheduler API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "psycopg2-binary==2.9.10",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
exclude = ["migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
