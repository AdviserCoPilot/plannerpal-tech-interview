name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-typescript:
    name: API – TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run tests
        run: npx vitest run

  api-python:
    name: API – Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_academy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest -v
        env:
          DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_academy

  api-java:
    name: API – Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test

  api-dotnet:
    name: API – C#/.NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  api-ruby:
    name: API – Ruby
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_academy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: false
      - run: bundle install
      - name: Run tests
        run: bundle exec rspec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_academy

  web:
    name: Web – Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
